services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: exam-db
    environment:
      SA_PASSWORD: "Password1!"
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"
    volumes:
      - sql_data:/var/opt/mssql

  backend:
    build:
      context: .
      dockerfile: IUS.ExamSystem.API/Dockerfile
    container_name: exam-api
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Server=sqlserver;Database=IUS_ExamSystem;User Id=sa;Password=Password1!;TrustServerCertificate=True;Encrypt=False;"
    ports:
      - "5000:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exam-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  sql_data: